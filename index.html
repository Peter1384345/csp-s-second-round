.v-CE{color:#ff9800;font-weight:700}

.prob-section{margin-bottom:18px}

.ai-chat-input input:focus{border-color:#00a65a}
.ai-quick-questions{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 12px}
.ai-qq{font-size:12px;padding:5px 12px;background:#e8f5e9;color:#00a65a;border-radius:14px;cursor:pointer;transition:all .15s;border:1px solid transparent}
.ai-qq:hover{border-color:#00a65a;background:#fff}
.ai-rec-prob{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#fafafa;border-radius:4px;margin-bottom:6px;cursor:pointer;transition:all .15s}
.ai-rec-prob:hover{background:#f0fff4}
.ai-rec-prob .rp-id{font-family:Consolas,monospace;color:#999;font-size:12px;min-width:48px}
.ai-rec-prob .rp-name{flex:1;font-size:13px;font-weight:500;color:#333}
.ai-rec-prob:hover .rp-name{color:#00a65a}
.ai-rec-prob .rp-reason{font-size:11.5px;color:#999;max-width:160px;text-align:right}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:flex;align-items:center;justify-content:center}
.modal-box{background:#fff;border-radius:8px;padding:28px 32px;width:380px;max-width:90vw;box-shadow:0 8px 32px rgba(0,0,0,.15)}
.modal-box h3{font-size:18px;font-weight:700;margin-bottom:6px;text-align:center}
.modal-box .sub{text-align:center;color:#999;font-size:13px;margin-bottom:20px}
.modal-box label{display:block;font-size:13px;color:#666;margin-bottom:4px;font-weight:500}
.modal-box input{width:100%;height:40px;border:1px solid #ebebeb;border-radius:4px;padding:0 12px;font-size:14px;margin-bottom:14px;outline:none;transition:border-color .15s}
.modal-box input:focus{border-color:#00a65a;box-shadow:0 0 0 2px rgba(0,166,90,.1)}
.modal-actions{display:flex;gap:10px;margin-top:6px}
.modal-actions .btn{flex:1}
.empty{text-align:center;padding:32px 16px;color:#bbb;font-size:13.5px}
@media(max-width:900px){.two-col,.problem-layout{grid-template-columns:1fr}.grid.g3{grid-template-columns:1fr 1fr}.topnav .search-box input{width:140px}.topnav .nav-links a{padding:0 10px}}
</style>
</head>
