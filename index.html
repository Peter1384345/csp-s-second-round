a{color:#00a65a;text-decoration:none;cursor:pointer}

.v-CE{color:#fa8c16;font-weight:700}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:4px;height:32px;padding:0 14px;border-radius:4px;font-size:13px;cursor:pointer;border:1px solid transparent;transition:all .15s;white-space:nowrap;text-decoration:none}
.btn-primary{background:#00a65a;color:#fff;border-color:#00a65a}

.chip{display:inline-block;padding:3px 10px;border:1px solid #d9d9d9;border-radius:4px;font-size:12px;color:#666;cursor:pointer;transition:all .15s;margin-right:4px}

.rand-btn:hover{border-color:#00a65a;color:#00a65a}
.searchbox{position:relative;margin-bottom:12px}
.searchbox input{width:100%;height:38px;border:1px solid #ebebeb;border-radius:4px;padding:0 12px 0 36px;font-size:13.5px;background:#fff;outline:none;transition:border-color .15s}

.prob-section{margin-bottom:20px}

.kbd{background:#f5f5f5;padding:1px 5px;border-radius:3px;font-family:Consolas,monospace;font-size:12px;color:#666}

.fav-btn{color:#d9d9d9;transition:color .15s}

.info-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid #fafafa;font-size:13px}

.info-row span:first-child{color:#999}
.bar{height:6px;background:#f0f0f0;border-radius:3px;overflow:hidden}

.kcard-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}

.kcard .kc-name{font-size:13px;font-weight:600;color:#333;margin-bottom:4px}
.kcard .kc-state{font-size:11px;padding:1px 6px;border-radius:3px}
.kc-ok{background:#52c41a;color:#fff}
.kc-review{background:#f5222d;color:#fff}
.kc-none{background:#e0e0e0;color:#999}
.viz-ctl{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.viz-ctl .prog{margin-left:auto;font-size:12px;color:#999;font-family:Consolas,monospace}
.viz-stage{background:#fafafa;border:1px solid #f0f0f0;border-radius:4px;padding:16px;min-height:180px;font-family:Consolas,monospace;font-size:13px;line-height:1.8;overflow-x:auto;transition:box-shadow .3s}

.minecmp.bad{background:#fff1f0;border:1px solid #ffa39e}
.lk-check{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.ck{padding:4px 10px;border-radius:4px;font-size:12px;font-family:Consolas,monospace;cursor:default}
.ck.ok{background:#f6ffed;color:#52c41a;border:1px solid #b7eb8f}

.ck.bad:hover{background:#ffeaea}
.disc-input{width:100%;min-height:60px;border:1px solid #ebebeb;border-radius:4px;padding:10px;font-size:13px;resize:vertical;outline:none;font-family:inherit}

.disc-item{padding:12px 0;border-bottom:1px solid #f5f5f5}

.disc-user{font-size:13px;font-weight:600;color:#333}
.disc-time{font-size:11.5px;color:#bbb}
.disc-content{font-size:13px;color:#555;line-height:1.7;padding-left:32px}
.sub-row{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid #f5f5f5;cursor:pointer;transition:background .1s;font-size:13px}
.sub-row:hover{background:#f0fff4}

.home-prob-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #fafafa;cursor:pointer;transition:background .1s}

.hpr-diff{font-size:11px}
.user-card{text-align:center;padding:8px 0}
.big-avatar{width:56px;height:56px;border-radius:50%;background:#00a65a;color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;margin:0 auto 10px}
.uname{font-size:16px;font-weight:700;color:#333}
.udesc{font-size:12px;color:#999;margin:2px 0 12px}
.uc-stats{display:flex;justify-content:center;gap:24px}

.pm-icon{font-size:20px}
.pm-name{flex:1;font-size:13px;font-weight:600;color:#333}
.pm-meta{font-size:12px;color:#999}

.pl-card h3{font-size:14.5px;margin-bottom:4px}
.plist{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.pl-chip{font-size:11.5px;padding:3px 8px;background:#fafafa;border:1px solid #f0f0f0;border-radius:3px;cursor:pointer;transition:all .15s;color:#666}

.ring{width:72px;height:72px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),#f0f0f0 0);display:flex;align-items:center;justify-content:center;position:relative;flex-shrink:0}
.ring::before{content:'';position:absolute;width:56px;height:56px;background:#fff;border-radius:50%}

.modal-box input:focus{border-color:#00a65a}
.modal-actions{display:flex;gap:8px;margin-top:8px}
