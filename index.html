<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CSP-S 2026 第二轮 · 在线刷题与实时评测</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5/lib/codemirror.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5/theme/default.min.css">
<script src="https://cdn.jsdelivr.net/npm/codemirror@5/lib/codemirror.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5/mode/clike/clike.min.js"></script>
<style>
:root{--brand:#00a65a;--brand2:#008d4c;--ink:#1f2937;--muted:#6b7280;--line:#e5e7eb;--bg:#f5f7fa;--card:#fff;--gray:#94a3b8;--graybg:#f1f5f9;--red:#dc2626;--green:#16a34a;--orange:#f59e0b;--blue:#2563eb;--purple:#9333ea;--editor:#1e293b;}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.6}
a{color:var(--brand);text-decoration:none;cursor:pointer}
a:hover{text-decoration:underline}
#topbar{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:100;box-shadow:0 1px 3px rgba(0,0,0,.04)}
#topbar .inner{max-width:1200px;margin:0 auto;padding:0 20px;display:flex;align-items:center;height:56px;gap:24px}
#logo{font-size:18px;font-weight:800;color:var(--brand);display:flex;align-items:center;gap:8px;white-space:nowrap}
#logo .dot{width:28px;height:28px;border-radius:7px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;display:grid;place-items:center;font-size:14px}
#nav{display:flex;gap:4px;flex:1}
#nav button{background:none;border:none;padding:8px 14px;font-size:14px;color:var(--muted);cursor:pointer;border-radius:6px;font-weight:600}
#nav button:hover{color:var(--ink);background:var(--graybg)}
#nav button.active{color:var(--brand);background:rgba(0,166,90,.08)}
#cd{font-size:12.5px;color:var(--muted);white-space:nowrap;font-weight:600}
#cd b{color:var(--brand)}
#mockbar{background:linear-gradient(90deg,#fff7ed,#fef3c7);border-bottom:1px solid #fde68a;padding:6px 20px;display:flex;align-items:center;gap:14px;font-size:13px}
#mockbar.hidden{display:none}
#mockbar .pb{background:#fff;border:1px solid #f59e0b;color:#92400e;padding:3px 10px;border-radius:5px;cursor:pointer;font-weight:700;font-size:12px}
#mockbar .pb:hover{background:#fef3c7}
#mocktime{font-weight:800;color:#92400e;font-family:ui-monospace,monospace;font-size:15px}
#app{max-width:1200px;margin:0 auto;padding:20px}
h1{font-size:26px;margin:0 0 6px}
h2{font-size:22px;margin:0 0 4px}
h3{font-size:16px;margin:14px 0 8px}
.sub{color:var(--muted);font-size:13px;margin:0 0 14px}
.mb{margin-bottom:14px}
.mt{margin-top:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:14px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;text-align:center;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.stat .k{color:var(--muted);font-size:12.5px;margin-bottom:4px}
.stat .v{font-size:28px;font-weight:800;color:var(--brand)}
.stat .v small{font-size:14px;color:var(--muted);font-weight:500}
.alert{border-radius:8px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;font-size:13.5px}
.alert.warn{background:#fffbeb;border:1px solid #fde68a;color:#92400e}
.alert.info{background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:7px;border:1px solid transparent;cursor:pointer;font-size:13.5px;font-weight:600;text-decoration:none;transition:.15s}
.btn:hover{text-decoration:none;transform:translateY(-1px)}
.btn-primary{background:var(--brand);color:#fff}
.btn-primary:hover{background:var(--brand2)}
.btn-primary:disabled{background:#a7c4b4;cursor:not-allowed;transform:none}
.btn-ghost{background:#fff;color:var(--ink);border-color:var(--line)}
.btn-ghost:hover{border-color:var(--brand);color:var(--brand)}
.btn-sm{padding:5px 11px;font-size:12.5px}
.tag{display:inline-block;padding:2px 8px;border-radius:5px;font-size:11.5px;font-weight:600;margin:1px 2px}
.t-tag{background:var(--graybg);color:var(--gray)}
.t-know{background:rgba(0,166,90,.1);color:var(--brand)}
.t-diff1{background:#e8f5e9;color:#2e7d32}
.t-diff2{background:#e0f7fa;color:#00838f}
.t-diff3{background:#e3f2fd;color:#1565c0}
.t-diff4{background:#f3e5f5;color:#7b1fa2}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line)}
th{background:var(--graybg);font-weight:700;color:var(--muted);font-size:12.5px}
.compare td:nth-child(2){color:var(--muted)}
.compare td:nth-child(3){font-weight:600}
.searchbox{display:flex;align-items:center;background:#fff;border:1px solid var(--line);border-radius:8px;padding:0 12px;margin-bottom:12px}
.searchbox .ic{color:var(--muted)}
.searchbox input{flex:1;border:none;outline:none;padding:10px 8px;font-size:14px;background:transparent}
.chip{display:inline-block;padding:4px 11px;border-radius:99px;background:#fff;border:1px solid var(--line);font-size:12.5px;cursor:pointer;color:var(--muted);margin:2px;user-select:none}
.chip:hover{border-color:var(--brand);color:var(--brand)}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.lv{display:inline-block;padding:2px 8px;border-radius:4px;color:#fff;font-size:11.5px;font-weight:700}
.lvbar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--graybg)}
.problem-row{display:flex;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid var(--line);cursor:pointer;transition:.12s;position:relative}
.problem-row:last-child{border-bottom:none}
.problem-row:hover{background:rgba(0,166,90,.04)}
.problem-row::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--dc,var(--line))}
.problem-row .id{font-weight:800;color:var(--brand);font-family:ui-monospace,monospace;font-size:13px;width:42px}
.problem-row .nm{flex:1;font-weight:600;font-size:14px}
.status{font-size:12px;font-weight:700;padding:2px 8px;border-radius:4px}
.st-done{background:#dcfce7;color:#15803d}
.st-part{background:#fef3c7;color:#a16207}
.st-wa{background:#fee2e2;color:#b91c1c}
.st-none{background:var(--graybg);color:var(--gray)}
.phead{font-size:12px;color:var(--muted)}
/* 题目页 */
.problem-wrap{display:grid;gap:16px}
.panel{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.panel-hd{padding:10px 16px;border-bottom:1px solid var(--line);font-weight:700;font-size:13.5px;background:var(--graybg);display:flex;align-items:center}
.sample-box{background:var(--graybg);border:1px solid var(--line);border-radius:7px;padding:10px 14px;margin:6px 0;font-family:ui-monospace,Consolas,monospace;font-size:13px;white-space:pre-wrap;position:relative}
.sample-box .lbl{position:absolute;top:-8px;left:10px;background:var(--brand);color:#fff;font-size:10.5px;padding:1px 7px;border-radius:4px;font-weight:700;font-family:sans-serif}
.kbd{background:var(--graybg);border:1px solid var(--line);border-radius:4px;padding:1px 6px;font-family:ui-monospace,monospace;font-size:12px}
.editor-tools{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--graybg)}
.editor-tools .btns{margin-left:auto;display:flex;gap:6px}
.tpl{border:1px solid var(--line);border-radius:5px;padding:4px 8px;font-size:12.5px;background:#fff}
.CodeMirror{height:380px;font-size:13px}
.result-item{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line);font-size:13px}
.result-item:last-child{border-bottom:none}
.result-item .ti{color:var(--muted);font-size:11.5px}
.v-AC{color:var(--green);font-weight:700}
.v-WA{color:var(--red);font-weight:700}
.v-CE{color:var(--orange);font-weight:700}
.v-RE{color:var(--purple);font-weight:700}
.v-TLE{color:var(--blue);font-weight:700}
.v-ERR{color:var(--gray);font-weight:700}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.detail-pre{background:#1e293b;color:#fca5a5;padding:10px;border-radius:6px;font-size:12px;overflow-x:auto;white-space:pre-wrap;margin:4px 0}
.bar{height:8px;background:var(--graybg);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2));border-radius:4px;transition:width .4s}
.ring{width:80px;height:80px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--graybg) 0);display:grid;place-items:center;position:relative}
.ring::before{content:"";position:absolute;inset:8px;background:#fff;border-radius:50%}
.ring b{position:relative;font-size:18px}
.know-block .cat{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-weight:700}
.know-block .pct{margin-left:auto;color:var(--muted);font-size:12.5px}
.pl-card{display:flex;flex-direction:column}
.plist{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.pl-chip{background:var(--graybg);padding:4px 9px;border-radius:5px;font-size:12px;cursor:pointer;border:1px solid transparent}
.pl-chip:hover{border-color:var(--brand);color:var(--brand)}
.empty{text-align:center;color:var(--muted);padding:24px;font-size:13.5px}
.hidden{display:none!important}
/* 知识点卡片 */
.kcard-row{display:flex;gap:10px;flex-wrap:wrap}
.kcard{background:var(--graybg);border:2px solid var(--line);border-radius:8px;padding:10px 14px;cursor:pointer;transition:.15s;min-width:120px;position:relative}
.kcard:hover{border-color:var(--brand)}
.kcard.mastered{background:#dcfce7;border-color:#22c55e}
.kcard.flagged{background:#fee2e2;border-color:#ef4444;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.3)}50%{box-shadow:0 0 0 6px rgba(239,68,68,0)}}
.kc-name{font-weight:700;font-size:13px}
.kc-state{font-size:11px;display:block;margin-top:3px}
.ks-ok{color:#15803d}
.ks-review{color:#b91c1c;font-weight:700}
.ks-none{color:var(--gray)}
/* 可视化 */
.viz-ctl{display:flex;align-items:center;gap:8px;padding:10px;background:var(--graybg);border-radius:8px 8px 0 0;border-bottom:1px solid var(--line)}
.viz-ctl .prog{margin-left:auto;font-size:12.5px;color:var(--muted);font-weight:600}
.viz-stage{padding:16px;background:#fff;min-height:180px;font-family:ui-monospace,Consolas,monospace;font-size:13px}
.viz-desc{padding:10px 16px;background:#f0fdf4;border-top:1px solid #bbf7d0;font-size:13px;color:#166534;border-radius:0 0 8px 8px}
.viz-array{display:inline-flex;gap:0;margin:4px 0}
.viz-cell{width:36px;height:36px;border:1px solid var(--line);display:grid;place-items:center;font-weight:700;background:#fff;position:relative}
.viz-cell.hl{background:#fef08a;border-color:#f59e0b;color:#92400e}
.viz-cell.bad{background:#fecaca;border-color:#ef4444;color:#991b1b}
.viz-cell.good{background:#bbf7d0;border-color:#22c55e;color:#15803d}
.viz-cell .idx{position:absolute;bottom:-16px;font-size:10px;color:var(--gray);font-weight:400}
.minebox{margin-top:12px;padding:12px;background:#f8fafc;border:1px solid var(--line);border-radius:8px}
.minecmp{padding:12px;border-radius:8px;margin-top:8px;font-size:13px}
.minecmp.ok{background:#f0fdf4;border:1px solid #bbf7d0}
.minecmp.bad{background:#fef2f2;border:1px solid #fecaca}
.lk-check{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.ck{padding:4px 10px;border-radius:5px;font-size:12px;font-weight:600;cursor:default;font-family:ui-monospace,monospace}
.ck.ok{background:#dcfce7;color:#15803d}
.ck.bad{background:#fee2e2;color:#b91c1c;cursor:pointer;border:1px dashed #ef4444}
.ck.bad:hover{background:#fecaca}
.flash-bad{animation:flashbad 1s ease-in-out 2}
@keyframes flashbad{0%,100%{box-shadow:none}50%{box-shadow:0 0 0 4px rgba(239,68,68,.4);border-color:#ef4444}}
/* 洛谷风格 */
.lgbreadcrumb{padding:8px 0}
.luogu-id{font-family:ui-monospace,monospace;font-weight:700;color:var(--brand)}
.lgtabs{display:flex;gap:0;border-bottom:2px solid var(--line)}
.lgtab{padding:10px 18px;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-2px;transition:.15s}
.lgtab:hover{color:var(--ink)}
.lgtab.on{color:var(--brand);border-bottom-color:var(--brand)}
.lginfo{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
.lginfo:last-child{border-bottom:none}
.lginfo span:first-child{color:var(--muted)}
.tut-code{background:var(--editor);color:#e2e8f0;padding:14px;border-radius:8px;font-family:ui-monospace,Consolas,monospace;font-size:12.5px;overflow-x:auto;white-space:pre;line-height:1.6;margin:8px 0}
.disc-item{padding:12px 0;border-bottom:1px solid var(--line)}
.disc-item:last-child{border-bottom:none}
.disc-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.disc-avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}
.disc-user{font-weight:700;font-size:13px}
.disc-time{color:var(--muted);font-size:11.5px;margin-left:auto}
.disc-content{font-size:13.5px;line-height:1.7;padding-left:36px;white-space:pre-wrap}
.disc-input{width:100%;min-height:70px;border:1px solid var(--line);border-radius:8px;padding:10px;font-size:13.5px;font-family:inherit;resize:vertical}
.disc-input:focus{outline:none;border-color:var(--brand)}
.prob-stats{display:flex;gap:16px;padding:10px 0;font-size:13px}
.fav-btn{cursor:pointer;user-select:none;font-size:18px;color:var(--gray);transition:.15s}
.fav-btn:hover{color:var(--orange)}
.fav-btn.on{color:var(--orange)}
.sub-row{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line);cursor:pointer;font-size:13px;transition:.12s}
.sub-row:last-child{border-bottom:none}
.sub-row:hover{background:rgba(0,166,90,.04)}
.sub-row .sid{font-family:ui-monospace,monospace;color:var(--muted);font-size:12px;width:70px}
.sub-row .st{width:60px;font-size:12px;font-weight:700;text-align:center;padding:2px 0;border-radius:4px}
.lb-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.lb-row:last-child{border-bottom:none}
.lb-rank{width:28px;height:28px;border-radius:50%;background:var(--graybg);display:grid;place-items:center;font-weight:800;font-size:13px;color:var(--muted)}
.lb-rank.r1{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#fff}
.lb-rank.r2{background:linear-gradient(135deg,#94a3b8,#64748b);color:#fff}
.lb-rank.r3{background:linear-gradient(135deg,#fb923c,#ea580c);color:#fff}
.lb-name{flex:1;font-weight:600}
.lb-score{font-weight:800;color:var(--brand);font-family:ui-monospace,monospace}
.rand-btn{background:#fff;border:1px solid var(--line);border-radius:6px;padding:5px 12px;font-size:12.5px;cursor:pointer;font-weight:600;color:var(--ink)}
.rand-btn:hover{border-color:var(--brand);color:var(--brand)}
.solbox{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;padding:12px 16px;margin:8px 0;font-size:13.5px;line-height:1.8}
@media(max-width:900px){.g2,.g3,.g4{grid-template-columns:1fr}.problem-wrap{grid-template-columns:1fr!important}#nav{overflow-x:auto}#topbar .inner{gap:10px;padding:0 12px}}
</style>
</head>
<body>
<div id="topbar">
  <div class="inner">
    <div id="logo"><span class="dot">CSP</span> 第二轮备考</div>
    <div id="nav">
      <button data-view="dashboard" class="active">首页</button>
      <button data-view="practice">题库</button>
      <button data-view="playlists">题单</button>
      <button data-view="mock">模拟赛</button>
      <button data-view="knowledge">知识图谱</button>
      <button data-view="records">我的记录</button>
    </div>
    <div id="cd"></div>
  </div>
</div>
<div id="mockbar" class="hidden">
  <b>⏱ 模拟赛进行中</b>
  <span id="mockprobs"></span>
  <span style="margin-left:auto">剩余 <span id="mocktime">4:00:00</span></span>
</div>
<div id="app"></div>

<script>
/*================ 题库数据（CSP-S 提高组第二轮考点全覆盖） ================*/
window.CSP_PROBLEMS=[
{id:"p01",no:1,tier:"T1",title:"数字统计",tag:"模拟 / 枚举",diff:1,points:100,constraints:"1s / 256MB",
 knowledge:["枚举与模拟","STL 容器"],
 statement:"给定两个正整数 L 和 R（1≤L≤R≤10^6），统计区间 [L,R] 中所有整数的十进制表示里，数字 2 出现的总次数。",
 inputFormat:"一行两个整数 L R。",outputFormat:"一个整数，表示数字 2 出现的总次数。",
 sample:{input:"2 22",output:"6"},
 solution:"从 L 到 R 枚举每个数，逐位取模 10 判断是否为 2 并计数。复杂度 O((R-L+1)×位数)，R≤10^6 完全没问题。也可以用数位 DP 做更大范围。",
 judge:[{input:"2 22\n",output:"6",score:30},{input:"1 100\n",output:"20",score:30},{input:"123 4567\n",output:"1441",score:40}]},
{id:"p02",no:2,tier:"T1",title:"区间和查询",tag:"前缀和",diff:1,points:100,constraints:"1s / 256MB",
 knowledge:["前缀和 / 差分","枚举与模拟"],
 statement:"给定长度为 n 的数组 a 和 q 次询问，每次询问给出 l,r，求 a[l]+a[l+1]+…+a[r] 的和。",
 inputFormat:"第一行 n q；第二行 n 个整数；接下来 q 行每行 l r。",outputFormat:"每行一个整数表示答案。",
 sample:{input:"5 3\n1 2 3 4 5\n1 3\n2 5\n1 5",output:"6\n14\n15"},
 solution:"预处理前缀和 s[i]=a[1]+…+a[i]，每次询问 O(1) 输出 s[r]-s[l-1]。注意下标从 1 开始。",
 judge:[{input:"5 3\n1 2 3 4 5\n1 3\n2 5\n1 5\n",output:"6\n14\n15",score:50},{input:"6 2\n10 -5 3 7 -2 4\n1 6\n2 4\n",output:"17\n5",score:50}]},
{id:"p03",no:3,tier:"T2",title:"切绳子",tag:"二分答案",diff:2,points:100,constraints:"1s / 256MB",
 knowledge:["二分答案","贪心"],
 statement:"有 n 根绳子，长度分别为 a[i]。现在要切出 k 段长度相同的绳子，问每段最长能有多长（保留两位小数）。",
 inputFormat:"第一行 n k；第二行 n 个正整数。",outputFormat:"一个浮点数，保留两位小数。",
 sample:{input:"4 11\n8 10 12 15",output:"3.00"},
 solution:"二分答案长度 x，判断 sum(a[i]/x)≥k 是否成立。为避免浮点误差，可以把长度乘 100 转成整数二分。",
 judge:[{input:"4 11\n8 10 12 15\n",output:"3.00",score:40},{input:"3 5\n5 5 5\n",output:"3.00",score:30},{input:"1 1\n100\n",output:"100.00",score:30}]},
{id:"p04",no:4,tier:"T2",title:"会议安排",tag:"贪心",diff:2,points:100,constraints:"1s / 256MB",
 knowledge:["贪心","排序"],
 statement:"有 n 个会议，每个会议有开始时间 s[i] 和结束时间 e[i]。一个会议室同一时间只能开一个会，问最多能安排多少个不冲突的会议。",
 inputFormat:"第一行 n；接下来 n 行每行 s e。",outputFormat:"一个整数，表示最多会议数。",
 sample:{input:"4\n1 3\n2 4\n3 5\n4 6",output:"3"},
