<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSP-S 2026 第二轮 · 在线刷题与实时评测</title>
<meta name="description" content="CSP-S 提高组第二轮（机试）备考平台：在线答题 + 实时评测 + 考点全覆盖 + 模拟赛。零依赖单文件，可本地运行或托管于 GitHub Pages。">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<style>
:root{
  --bg:#f4f6fb; --card:#ffffff; --ink:#1f2d3d; --muted:#6b7a90; --line:#e3e9f2;
  --brand:#2563eb; --brand2:#0ea5e9; --green:#16a34a; --greenbg:#e6f6ec; --red:#dc2626; --redbg:#fdecec;
  --amber:#d97706; --amberbg:#fdf3e3; --gray:#64748b; --graybg:#eef2f7;
  --editor:#1e1e2e; --radius:14px; --shadow:0 6px 24px rgba(15,30,60,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
a{color:var(--brand);text-decoration:none}
pre{font-family:"JetBrains Mono",ui-monospace,Consolas,Menlo,monospace}
.topbar{position:sticky;top:0;z-index:50;background:#ffffff;border-bottom:1px solid var(--line);box-shadow:0 1px 0 rgba(15,30,60,.04)}
.topbar .in{max-width:1200px;margin:0 auto;padding:0 20px;display:flex;align-items:center;gap:18px;height:58px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;color:var(--ink);white-space:nowrap}
.logo .badge{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;padding:4px 9px;border-radius:9px;font-size:12px;letter-spacing:.5px}
.nav{display:flex;gap:4px;margin-left:8px;flex-wrap:wrap}
.nav button{background:none;border:none;padding:9px 13px;border-radius:9px;cursor:pointer;font-size:14px;color:var(--muted);font-weight:600;transition:.15s}
.nav button:hover{background:#eef3fb;color:var(--brand)}
.nav button.active{background:var(--brand);color:#fff}
.navright{margin-left:auto;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:10px}
.countdown{display:inline-block;background:var(--graybg);padding:5px 11px;border-radius:999px;font-variant-numeric:tabular-nums}
.wrap{max-width:1200px;margin:0 auto;padding:22px 20px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px}
.hidden{display:none !important}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:900px){.g2,.g3,.g4{grid-template-columns:1fr 1fr}.nav{display:none}}
@media(max-width:640px){.g2,.g3,.g4{grid-template-columns:1fr}}
h2{font-size:20px;margin-bottom:4px}
h3{font-size:16px}
.sub{color:var(--muted);font-size:13px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
.stat .k{font-size:12px;color:var(--muted)}
.stat .v{font-size:26px;font-weight:800;margin-top:2px}
.stat .v small{font-size:13px;font-weight:600;color:var(--muted)}
.bar{height:8px;background:var(--graybg);border-radius:99px;overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2));border-radius:99px;transition:width .4s}
.tag{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;margin:2px 3px 2px 0}
.t-tier{background:#eef3ff;color:#2563eb}
.t-know{background:var(--greenbg);color:var(--green)}
.t-tag{background:var(--graybg);color:var(--gray)}
.chip{display:inline-block;padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted);margin:4px;transition:.15s}
.chip:hover{border-color:var(--brand);color:var(--brand)}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600;background:#fafbfe}
tr:hover td{background:#f7fafd}
.v-AC{color:var(--green);font-weight:700}
.v-WA{color:var(--red);font-weight:700}
.v-RE,.v-CE{color:var(--amber);font-weight:700}
.v-TLE{color:var(--gray);font-weight:700}
.btn{border:none;cursor:pointer;border-radius:10px;padding:11px 20px;font-size:14px;font-weight:700;transition:.15s}
.btn-primary{background:var(--brand);color:#fff}
.btn-primary:hover{background:#1d4ed8}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.btn-ghost{background:#fff;color:var(--brand);border:1px solid var(--brand)}
.btn-ghost:hover{background:#eef3ff}
.problem-wrap{display:grid;grid-template-columns:minmax(300px,1fr) minmax(420px,1.15fr);gap:18px}
@media(max-width:980px){.problem-wrap{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.panel-hd{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);background:#fafbfe;font-weight:700;font-size:14px}
.editor-tools{padding:10px 14px;background:#ffffff;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.editor-tools .btns{margin-left:auto;display:flex;gap:8px}
.CodeMirror{height:430px;font-size:13.5px;line-height:1.5}
.result-item{display:flex;justify-content:space-between;align-items:center;padding:9px 14px;border-bottom:1px solid var(--line);font-size:14px}
.result-item .ti{color:var(--muted);font-size:12px}
.diff-star{color:#f59e0b;letter-spacing:1px}
.sample-box{background:#0f172a;color:#e2e8f0;border-radius:9px;padding:12px 14px;font-size:13px;overflow:auto;margin:6px 0}
.sample-box .lbl{color:#94a3b8;font-size:11px;text-transform:uppercase;margin-bottom:4px}
code.kbd{background:#eef2f7;padding:1px 6px;border-radius:5px;font-family:Consolas,monospace;font-size:12.5px}
.solbox{background:var(--amberbg);border:1px solid #f6e2c0;border-radius:10px;padding:14px 16px;margin-top:12px;font-size:14px}
.know-block{margin-bottom:18px}
.know-block .cat{font-weight:800;margin-bottom:8px;display:flex;align-items:center;gap:10px}
.know-block .cat .pct{margin-left:auto;font-size:12px;color:var(--muted);font-weight:600}
.problem-row{display:flex;align-items:center;gap:14px;padding:13px 16px;border-bottom:1px solid var(--line);cursor:pointer;transition:.12s}
.problem-row:hover{background:#f5f8fe}
.problem-row .id{font-family:Consolas,monospace;color:var(--muted);font-size:13px;width:46px}
.problem-row .nm{font-weight:700;flex:1}
.problem-row .status{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px}
.st-done{background:var(--greenbg);color:var(--green)}
.st-part{background:var(--amberbg);color:var(--amber)}
.st-none{background:var(--graybg);color:var(--gray)}
.st-wa{background:var(--redbg);color:var(--red)}
.mockbar{position:sticky;top:58px;z-index:40;background:#0f172a;color:#e2e8f0;padding:10px 0}
.mockbar .in{max-width:1200px;margin:0 auto;padding:0 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.mockbar .t{font-weight:700}
.mockbar .probs{display:flex;gap:6px;flex-wrap:wrap}
.mockbar .pb{background:rgba(255,255,255,.12);color:#fff;padding:4px 10px;border-radius:8px;font-size:12px;cursor:pointer}
.mockbar .pb.active{background:var(--brand)}
.mockbar .pb.done{background:var(--green)}
.mockbar .time{margin-left:auto;font-variant-numeric:tabular-nums;font-size:16px;font-weight:800;color:#7dd3fc}
.footer{max-width:1200px;margin:0 auto;padding:18px 20px;color:var(--muted);font-size:12.5px;border-top:1px solid var(--line)}
.mt{margin-top:18px}
.mb{margin-bottom:12px}
.alert{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:12px;font-size:13.5px}
.alert.warn{background:var(--amberbg);border:1px solid #f6e2c0;color:#7c4a12}
.compare th{width:50%}
.ring{--p:0;--c:var(--brand);width:74px;height:74px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),#e6ecf5 0);display:grid;place-items:center}
.ring b{width:56px;height:56px;background:#fff;border-radius:50%;display:grid;place-items:center;font-size:16px}
.detail-pre{white-space:pre-wrap;word-break:break-word}
.empty{text-align:center;color:var(--muted);padding:36px 0;font-size:14px}
.spinner{display:inline-block;width:15px;height:15px;border:2px solid #cbd5e1;border-top-color:var(--brand);border-radius:50%;animation:sp 0.7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<header class="topbar">
  <div class="in">
    <div class="logo"><span class="badge">CSP-S</span>第二轮 · 在线刷题评测</div>
    <nav class="nav" id="nav">
      <button data-view="dashboard">首页</button>
      <button data-view="practice">题库</button>
      <button data-view="mock">模拟赛</button>
      <button data-view="knowledge">知识图谱</button>
      <button data-view="records">我的记录</button>
    </nav>
    <div class="navright"><span class="countdown" id="cd"></span></div>
  </div>
</header>

<div class="mockbar hidden" id="mockbar">
  <div class="in">
    <span class="t">⚡ 模拟赛进行中</span>

    <span class="time" id="mocktime">--:--</span>
  </div>
</div>

<main class="wrap" id="app"></main>

window.CSP_PROBLEMS=[{"id":"p01","no":1,"title":"数字统计","tier":"T1","diff":1,"knowledge":["排序","哈希 / 计数统计"],"tag":"基础算法 · 模拟","points":100,"statement":"给定 n 个整数，统计每个不同数值出现的次数，并按数值从小到大输出。","inputFormat":"第一行一个整数 n（1 ≤ n ≤ 1e5）。第二行 n 个整数 aᵢ（0 ≤ aᵢ ≤ 1e9）。","outputFormat":"若干行，每行两个整数，格式为“数值 次数”，按数值升序排列。","constraints":"时间 1s，内存 128MB。","solution":"用 map<long long,int> 计数，或读入后排序再统计。时间复杂度 O(n log n)，空间 O(n)。注意数值可达 1e9 需用 long long。","sample":{"input":"5\n1 2 1 3 2\n","output":"1 2\n2 2\n3 1"},"judge":[{"input":"5\n1 2 1 3 2\n","output":"1 2\n2 2\n3 1","score":20},{"input":"1\n1000000000\n","output":"1000000000 1","score":20},{"input":"8\n9 9 9 9 9 9 9 9\n","output":"9 8","score":20},{"input":"6\n5 4 3 2 1 5\n","output":"1 1\n2 1\n3 1\n4 1\n5 2","score":20},{"input":"7\n100 7 100 7 100 7 2\n","output":"2 1\n7 3\n100 3","score":20}]},{"id":"p02","no":2,"title":"区间和","tier":"T1","diff":1,"knowledge":["前缀和"],"tag":"基础算法 · 前缀和","points":100,"statement":"给定 n 个数 a₁..aₙ，进行 q 次询问，每次给出区间 [l, r]，求该区间所有数之和。","inputFormat":"第一行两个整数 n, q（1 ≤ n, q ≤ 2e5）。第二行 n 个整数 aᵢ（|aᵢ| ≤ 1e9）。接下来 q 行，每行两个整数 l, r（1 ≤ l ≤ r ≤ n）。","outputFormat":"对每个询问输出一行，为该区间的和。","constraints":"时间 1s，内存 256MB。","solution":"预处理前缀和 pre[i]=pre[i-1]+a[i]，查询 O(1) 输出 pre[r]-pre[l-1]。注意结果用 long long。","sample":{"input":"5 3\n1 2 3 4 5\n1 5\n2 3\n3 3\n","output":"15\n5\n3"},"judge":[{"input":"5 3\n1 2 3 4 5\n1 5\n2 3\n3 3\n","output":"15\n5\n3","score":33},{"input":"4 2\n10 20 30 40\n2 4\n1 1\n","output":"90\n10","score":33},{"input":"3 1\n1000000000 1000000000 1000000000\n1 3\n","output":"3000000000","score":34}]},{"id":"p03","no":3,"title":"切绳子","tier":"T2","diff":2,"knowledge":["二分答案"],"tag":"二分 · 贪心","points":100,"statement":"有 n 根木棍，长度分别为 Lᵢ。现在要把它们切成 k 段等长的木棍（每段长度必须为正整数），求能切出的最大段长。","inputFormat":"第一行两个整数 n, k（1 ≤ n ≤ 1e5，1 ≤ k ≤ 1e9）。第二行 n 个整数 Lᵢ（1 ≤ Lᵢ ≤ 1e9）。","outputFormat":"一个整数，表示能切出的最大整数段长。","constraints":"时间 1s，内存 256MB。","solution":"答案满足单调性：段长 x 可行当且仅当 Σ(Lᵢ/x) ≥ k。对 x 在 [1, max(Lᵢ)] 上二分即可。复杂度 O(n log maxL)。"," const WANDBOX="https://wandbox.org/api/compile.json";
const COMPILER="gcc-13.2.0";
const DEFAULT_CODE=`#include <bits/stdc++.h>
using namespace std;
int main(){
    ios::sync_with_stdio(false);
    cin.tie(nullptr);

    return 0;
}
`;
function normOut(s){return (s||"").replace(/\r\n/g,"\n").replace(/[ \t]+$/gm,"").replace(/\s+$/,"");}
async function execWandbox(code,stdin){
  const ctrl=new AbortController();const timer=setTimeout(()=>ctrl.abort(),26000);
  const t0=Date.now();
  try{
    const res=await fetch(WANDBOX,{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({code:code,compiler:COMPILER,stdin:stdin||""}),signal:ctrl.signal});
    clearTimeout(timer);
    if(!res.ok) return {verdict:"ERR",detail:"服务返回状态 "+res.status};
    const j=await res.json(); const ms=Date.now()-t0;
    if(j.status==="1" || (j.compiler_message&&j.compiler_message.trim()))
      return {verdict:"CE",detail:(j.compiler_error||j.compiler_message||"").slice(0,600)};
    if(j.signal&&j.signal.trim())
      return {verdict:"RE",detail:j.signal+"  "+(j.program_error||"").trim().slice(0,200)};
    return {verdict:"RUN",out:j.program_output||"",err:(j.program_error||""),ms};
  }catch(e){
    clearTimeout(timer);
    return {verdict:"TLE",detail:"运行超时或服务无响应（约 26s）"};
  }
}
async function judgeTest(code,t){
  const r=await execWandbox(code,t.input);
  if(r.verdict!=="RUN"){
    const isCE=r.verdict==="CE";
    return {verdict:isCE?"CE":"RE",score:0,out:r.out,detail:r.detail,ce:isCE};
  }
  const got=normOut(r.out), want=normOut(t.output);
  if(got===want) return {verdict:"AC",score:t.score,ms:r.ms};
  return {verdict:"WA",score:0,out:got,detail:"期望输出与你的输出不一致",ms:r.ms};
}

/*================ 状态计算 ================*/
function problemStatus(id){
  const subs=getSubs().filter(s=>s.problem===id&&s.mode!=="mock");
  if(!subs.length) return "none";
  const best=Math.max(...subs.map(s=>s.score));
  if(best>=100) return "done";
  if(best>0) return "part";
  const last=subs[subs.length-1];
  return last&&last.verdictBest==="WA"?"wa":"part";
}

  for(const s of subs){ totalScore+=s.score; totalMax+=100; if(s.score>=100)full.add(s.problem); if(s.score>0)solved.add(s.problem); if(s.verdictBest==="WA")wa++; }
  const know=getKnow(); let marked=0, mastered=0;
  for(const c of KNOWLEDGE) for(const it of c.items){ if(know[it]){marked++; if(know[it]==="1")mastered++; } }
  const knowTotal=KNOWLEDGE.reduce((a,c)=>a+c.items.length,0);
  return {subs:solved.size,full:full.size,totalScore,totalMax,rate:totalMax?Math.round(totalScore/totalMax*100):0,wa,
          knowMarked:marked,knowMastered:mastered,knowTotal,solvedSet:solved};
}

async function submit(id,pre){
  if(submitting)return; submitting=true;
  const p=PROBLEMS.find(x=>x.id===id); const code=editor.getValue(); LS.set("csps_code_"+id,code);
  const btn=document.getElementById("submitBtn"); btn.disabled=true; btn.innerHTML='<span class="spinner"></span> 评测中…';
  const resBody=document.getElementById("resBody"); const resScore=document.getElementById("resScore");
  resScore.textContent="";
  const rows=[];
  let score=0, ce=false;
  const verdictLabel={AC:"AC 正确",WA:"WA 答案错误",RE:"RE 运行错误",CE:"CE 编译错误",TLE:"TLE/无响应",ERR:"服务异常"};
  for(let i=0;i<p.judge.length;i++){
    const t=p.judge[i];
    rows.push(`<div class="result-item" data-i="${i}"><span>测试点 ${i+1} <span class="ti">${t.score} 分</span></span><span class="spinner"></span></div>`);
    resBody.innerHTML=rows.join("");
    const r=await judgeTest(code,t);
    if(ce){/* already CE */ }
    else if(r.verdict==="CE"){ce=true;score=0;}
    else if(r.verdict==="AC")score+=t.score;
    let detail="";
    if(r.verdict==="WA")detail=`<div class="sub" style="margin-top:6px">${esc(r.detail)}<br>你的输出：<code class="kbd">${esc((r.out||"").slice(0,120))}</code> 期望：<code class="kbd">${esc((t.output||"").slice(0,120))}</code></div>`;
    else if(r.verdict==="CE")detail=`<div class="sub" style="margin-top:6px"><pre class="detail-pre">${esc(r.detail||"")}</pre></div>`;
    else if(r.verdict==="RE")detail=`<div class="sub" style="margin-top:6px">${esc(r.detail||"")}</div>`;
    rows[i]=`<div class="result-item"><span>测试点 ${i+1} <span class="ti">${t.score} 分</span></span><span class="v-${r.verdict}">${verdictLabel[r.verdict]}${r.ms?" · "+r.ms+"ms":""}</span></div>${detail}`;
    resBody.innerHTML=rows.join("");
    await new Promise(r=>setTimeout(r,120));
  }
  if(ce){resBody.innerHTML=rows.join("");resScore.innerHTML=`<span class="v-CE">编译错误 · 0 分</span>`;}
  else{resScore.innerHTML=`<span class="v-${score>=100?"AC":"WA"}" style="font-size:18px">${score} / 100 分</span>`;}
  const verdictBest=score>=100?"AC":(ce?"CE":(score>0?"部分":"WA"));
  const rec={id:uid(),time:Date.now(),problem:id,title:p.title,tier:p.tier,score,verdict:verdictBest,code,mode:pre&&pre.mock?"mock":"practice",mockId:pre&&pre.mock?pre.mock:undefined};
  const subs=getSubs(); subs.push(rec); saveSubs(subs);
  if(score>0&&score<100){const w=getWrong(); if(!w.find(x=>x.problem===id))w.push({problem:id,title:p.title,score});saveWrong(w);}
  if(pre&&pre.mock){ syncMockUI(); }
  submitting=false; btn.disabled=false; btn.textContent=pre&&pre.mock?"提交到模拟赛":"提交评测";
}

function renderMock(mid){

  const deadline=Number(LS.get(MOCK_DEADLINE_KEY,0));

function showMockbar(ctx){
  const bar=document.getElementById("mockbar"); bar.classList.remove("hidden");

    const p=PROBLEMS.find(x=>x.id===id); const best=bestMockScore(ctx.mid,id);

function bestMockScore(mid,id){
  const subs=getSubs().filter(s=>s.mode==="mock"&&s.problem===id&&(mockCtx&&s.mockId===mid));
  if(!subs.length)return 0; return Math.max(...subs.map(s=>s.score));

function tickMock(){
  const bar=document.getElementById("mockbar"); const el=document.getElementById("mocktime");
  const iv=setInterval(()=>{
    const deadline=Number(LS.get(MOCK_DEADLINE_KEY,0));
    const left=Math.max(0,deadline-Date.now());
    const h=Math.floor(left/3600000),m=Math.floor(left%3600000/60000),s=Math.floor(left%60000/1000);
    el.textContent=`${h}:${normDate(m)}:${normDate(s)}`;
    if(left<=0){clearInterval(iv); const subs=getSubs().filter(s=>s.mode==="mock");
      let total=0; for(const sp of (mockCtx?mockCtx.problems:[])) total+=bestMockScore(mockCtx.mid,sp);
      LS.set("csps_mockscore_"+mockCtx.mid,total);
      if(mockCtx){el.textContent="已结束"; const names=mockCtx.problems.map(id=>PROBLEMS.find(p=>p.id===id).title);

          alert(`⏱ 模拟赛结束！\n${names.join(" · ")}\n本场总分：${total} / 400`);} }
      }
  },1000);
}
function syncMockUI(){

  html+=`<div class="grid g2 mb">
    <div class="card"><h3>📕 错题本（部分分 / 未通过）</h3>
      ${wrong.length?wrong.map(w=>`<div class="problem-row" data-go="problem/${w.problem}"><span class="nm">${w.title}</span><span class="status st-wa">${w.score} 分</span><span style="color:var(--brand);font-size:13px">去重做 →</span></div>`).join(""):`<div class="empty">暂无错题，继续加油 🎯</div>`}
    </div>
    <div class="card"><h3>🧮 统计</h3><div class="sub">累计提交 ${subs.length} 次</div>
      <div class="grid g2" style="margin-top:8px">
        <div class="stat"><div class="k">满分题目</div><div class="v">${stats().full}<small> / ${PROBLEMS.length}</small></div></div>
        <div class="stat"><div class="k">平均得分率</div><div class="v">${stats().rate}<small>%</small></div></div>
      </div>
    </div></div>`;
  html+=`<div class="card"><h3>🕘 提交记录</h3>
    ${subs.length?`<table><thead><tr><th>时间</th><th>题目</th><th>类型</th><th>分数</th><th>结果</th><th></th></tr></thead><tbody>
    ${subs.slice(0,120).map(s=>{const d=new Date(s.time);const cls={AC:"v-AC",WA:"v-WA",CE:"v-CE","部分":"v-WA"}[s.verdict]||"v-WA";
      return `<tr><td>${d.getMonth()+1}-${d.getDate()} ${normDate(d.getHours())}:${normDate(d.getMinutes())}</td><td>${esc(s.title)}</td><td>${s.mode==="mock"?"模拟赛":"练习"}</td><td><b>${s.score}/100</b></td><td class="${cls}">${s.verdict==="AC"?"AC 正确":s.verdict==="CE"?"编译错误":s.verdict==="部分"?"部分分":"未通过"}</td><td><a data-viewcode="${s.id}">查看代码</a></td></tr>`;
    }).join("")}</tbody></table>`:`<div class="empty">还没有提交记录，去题库刷一道题吧。</div>`}</div>`;
  app.innerHTML=html; afterRender();
  document.querySelectorAll("[data-viewcode]").forEach(a=>a.onclick=()=>{const s=getSubs().find(x=>x.id===a.dataset.viewcode);if(s)alert(s.code);});
}

/*================ 路由 ================*/
function nav(hash,opts){
  const seg=hash.replace(/^#\//,"").split("/");
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("active",b.dataset.view===seg[0]));
  if(seg[0]==="problem"){ VIEWS.problem(seg[1],opts); }
  else if(seg[0]==="mockExam"){ VIEWS.mockExam(seg[1]); }
  else if(VIEWS[seg[0]]){ VIEWS[seg[0]](); }
  else VIEWS.dashboard();
  window.scrollTo(0,0);
}
function afterRender(){
  document.querySelectorAll("[data-go]").forEach(a=>a.onclick=()=>{const v=a.dataset.go;nav(v,{mock:a.dataset.mock});});
  document.querySelectorAll("#nav button").forEach(b=>b.onclick=()=>nav(b.dataset.view));
}

/*================ 启动 ================*/
function boot(){
  const cd=document.getElementById("cd");
  const tick=()=>{const left=countdownTo()-Date.now();if(left<=0){cd.textContent="考试已开始 🎯";return;}
    const d=Math.floor(left/86400000),h=Math.floor(left%86400000/3600000),m=Math.floor(left%3600000/60000);
    cd.textContent=`距机试 ${d}天 ${h}时 ${m}分`;};
  tick(); setInterval(tick,60000);
  const deadline=Number(LS.get(MOCK_DEADLINE_KEY,0));
  if(deadline>Date.now()){
    const mid=LS.get("csps_mockset_last","A"); const probs=LS.get("csps_mockset_"+mid,[]);
    if(probs.length){mockCtx={mid,problems:probs}; showMockbar(mockCtx); tickMock();}
  }
  nav((location.hash||"#/dashboard"));
  window.addEventListener("hashchange",()=>nav(location.hash));
}
document.addEventListener("DOMContentLoaded",boot);
</script>
</body>
</html>
